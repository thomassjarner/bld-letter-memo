name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLD_SYNC_URL: ${{ vars.BLD_SYNC_URL }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet==0.86.3

      - name: Publish static web app
        # --base-url must match the repo name for a GitHub Pages *project*
        # site (https://<user>.github.io/<repo>/). It's derived automatically
        # from the repository name so this keeps working if the repo is
        # ever renamed.
        run: |
          python scripts/cloud_build.py --stage "$RUNNER_TEMP/bld-site-src"
          cd "$RUNNER_TEMP/bld-site-src"
          flet publish main.py --base-url /${{ github.event.repository.name }}/ --distpath "$GITHUB_WORKSPACE/dist"

      - name: Add account callback and sync client
        run: python scripts/cloud_build.py --output dist

      - name: Add branded link preview and app icons
        run: >-
          python scripts/web_metadata.py --output dist
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
